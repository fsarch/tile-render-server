tiles:
  # No "input" setting here anymore - the pmtiles path comes exclusively from the
  # active row of the dataset_versions table (see the "Datasets and themes" section of
  # README.md for how to insert/activate one). Required for `npm start`; not used by
  # `npm test` or the batch CLI (`npm run render`), which still takes --input directly.
  cacheControl: public, max-age=3600
  labels: true
  roadLabels: true
  natureLabels: true
  # Bump whenever planet.pmtiles is regenerated/replaced, so cross-tile label anchors
  # cached in Postgres against a prior build's feature ids can't silently leak into a
  # new one (old rows for a previous version just become unreferenced).
  datasetVersion: ""
  # Optional: serve zoom levels beyond what planet.pmtiles actually contains by
  # "overzooming" - cropping and scaling the deepest real tile's geometry to stand in
  # for the requested one (API only, not the batch CLI). Omit to disable (requests
  # above the dataset's own max zoom get a 404, as without this setting). A value at or
  # below the dataset's max zoom is a no-op - this only ever extends serving upward.
  # maxZoom: 18

# Where the REST API reads/writes files, independent of local disk vs. S3 - see
# src/storage/. Required for `npm start`; not used by `npm test` or the batch CLI
# (`--input`/`--output` there are always plain local filesystem paths).
storage:
  # storage.data: where dataset_versions.path is resolved from (a local base directory,
  # or an S3 bucket/prefix) - "." reproduces the old tiles.input behavior (paths
  # relative to the project root).
  data: .
  # storage.cache: where rendered (pre-template) SVG tiles are cached, keyed by
  # dataset_version id + z/x/y - see REQUIREMENTS.md §18. A fresh/empty directory (or
  # bucket) is fine; it's populated on demand and never needs to be seeded.
  cache: ./cache
  # Both accept the same two shapes; a bare string is shorthand for
  # `{ type: filesystem, config: { path: <string> } }`. Uncomment for S3 (works
  # identically for storage.cache):
  # data:
  #   type: s3
  #   config:
  #     bucket: my-pmtiles-bucket
  #     region: eu-central-1
  #     accessKeyId: ...           # optional if using IAM roles/default AWS credentials
  #     secretAccessKey: ...       # required together with accessKeyId
  #     endpoint: https://...      # optional, for S3-compatible services (MinIO etc.)
  #     prefix: datasets/          # optional, prefixes every key

# Shared, persistent cache for cross-tile label anchor positions (see
# src/core/label-anchor-cache.ts). Required for `npm start` - not used by `npm test` or the
# batch CLI (`npm run render`).
database:
  type: postgres
  host: localhost
  port: 5432 # must be explicit: @fsarch/server defaults to 26257 (CockroachDB) otherwise
  username: maps_converter
  password: replace-me
  database: maps_converter

# Copy this file to config.yaml (gitignored - never commit real credentials) and fill
# in your actual database settings.
