<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PMTiles SVG API Example</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="panel">
        <div class="panel-text">
          <h1>SVG Tile Example</h1>
          <p>Quelle: <code>/v1/tiles/{z}/{x}/{y}.svg</code></p>
          <p>Optional: <code>?apiBase=http://127.0.0.1:3000</code></p>
          <p>Zoom und Position bleiben im URL-Hash erhalten.</p>
        </div>
        <div id="theme-toggle" class="theme-toggle" hidden>
          <button id="theme-toggle-button" type="button" aria-pressed="false">🌙 Dark Mode</button>
        </div>
      </header>
      <div id="map"></div>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/app.js"></script>
  </body>
</html>
