name: build our image

on:
  push:
    branches: main
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: enable corepack
        run: corepack enable
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: run unit tests
        run: pnpm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: determine image tags
        id: image
        run: |
          IMAGE=fsarch/tile-render-server
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${IMAGE}:${VERSION}"
            # only mark proper releases (no prerelease suffix, e.g. -beta.0) as stable
            if [[ "${VERSION}" != *-* ]]; then
              TAGS="${TAGS} ${IMAGE}:stable"
              echo "stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable=false" >> "$GITHUB_OUTPUT"
            fi
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            TAGS="${IMAGE}:latest"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          # Same tags, "-distroless" suffixed, for the Dockerfile.distroless
          # build below (e.g. fsarch/tile-render-server:1.2.3-distroless).
          DISTROLESS_TAGS=""
          for tag in ${TAGS}; do
            DISTROLESS_TAGS="${DISTROLESS_TAGS} ${tag}-distroless"
          done
          echo "distroless_tags=${DISTROLESS_TAGS}" >> "$GITHUB_OUTPUT"
      - name: build the image
        run: |
          TAG_ARGS=""
          for tag in ${{ steps.image.outputs.tags }}; do
            TAG_ARGS="${TAG_ARGS} --tag ${tag}"
          done

          docker buildx build \
            ${TAG_ARGS} \
            --platform linux/amd64,linux/arm64 \
            --push .
      - name: build the distroless image
        # Only for tagged releases, not every push to main (no :latest
        # counterpart - avoids doubling the build for the mainline "just
        # verify it still builds/pushes" case).
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_ARGS=""
          for tag in ${{ steps.image.outputs.distroless_tags }}; do
            TAG_ARGS="${TAG_ARGS} --tag ${tag}"
          done

          docker buildx build \
            ${TAG_ARGS} \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.distroless \
            --push .
      - name: notify helm-charts of the new release
        # success() is required here because a custom `if:` replaces the
        # step's implicit default (only run on success) - without it, this
        # would still fire even if "build the image" failed and neither the
        # version nor the :stable tag actually got pushed.
        # Only for proper releases (tags without a prerelease suffix), so
        # betas etc. don't bump the published chart.
        if: success() && steps.image.outputs.stable == 'true'
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.HELM_CHARTS_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fsarch/helm-charts/dispatches \
            -d '{"event_type":"tile-render-server-released","client_payload":{"version":"${{ steps.image.outputs.version }}"}}'
